<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You! - Tevin Mulinge</title>
    <meta name="description" content="Thank you for reaching out to Tevin Mulinge. Your message has been received!">
    
    <!-- CSS -->
    <link rel="stylesheet" href="script.css">
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="light-mode">
    <!-- Background overlay -->
    <div class="bg-overlay"></div>
    
    <div class="container thank-you-container">
        <!-- Theme Toggle -->
        <div class="theme-toggle-container">
            <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
                <i class="fas fa-sun light-icon"></i>
                <i class="fas fa-moon dark-icon"></i>
            </button>
        </div>

        <!-- THANK YOU CARD -->
        <section class="thank-you-section">
            <div class="thank-you-card">
                <div class="thank-you-icon">
                    <i class="fas fa-paper-plane"></i>
                    <i class="fas fa-check-circle"></i>
                </div>
                <h1>Thank You <span class="accent">!</span></h1>
                <p class="thank-you-message">Your message has been received and is now being processed.</p>
                <p class="thank-you-details">I'll get back to you within 24 hours. In the meantime, feel free to explore my projects.</p>
                
                <div class="thank-you-stats">
                    <div class="stat-item">
                        <i class="fas fa-clock"></i>
                        <span>24hr Response</span>
                    </div>
                    <div class="stat-item">
                        <i class="fas fa-code"></i>
                        <span>Built with ❤️</span>
                    </div>
                </div>
                
                <div class="thank-you-actions">
                    <a href="index.html#projects" class="btn btn-primary">
                        <i class="fas fa-arrow-left"></i> back to projects
                    </a>
                    <a href="index.html" class="btn btn-outline">
                        <i class="fas fa-home"></i> home
                    </a>
                </div>
                
                <div class="thank-you-social">
                    <p>connect with me:</p>
                    <div class="social-links">
                        <a href="https://github.com/tace925" target="_blank"><i class="fab fa-github"></i></a>
                        <a href="https://twitter.com/mulingeTev81504" target="_blank"><i class="fab fa-twitter"></i></a>
                        <a href="#" target="_blank"><i class="fab fa-linkedin"></i></a>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>
</body>
</html>
